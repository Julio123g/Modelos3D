    <script>
    window._v3dRealFetch=window.fetch.bind(window);
    window._v3dRealCreateObjectURL=URL.createObjectURL.bind(URL);
    window._v3dRealRevokeObjectURL=URL.revokeObjectURL.bind(URL);
    // WebGL getContext patch: powerPreference=low-power
    //        GPUs gama baja consumen menos y freezan menos en low-power.
    (function(){
      if(window._v3dCtxPatched)return;
      window._v3dCtxPatched=true;
      var _origGetCtx=HTMLCanvasElement.prototype.getContext;
      HTMLCanvasElement.prototype.getContext=function(type,attrs){
        attrs=attrs||{};
        // Solo tocar webgl/webgl2
        if(/webgl/i.test(type)){
          if(!attrs.powerPreference){
            attrs.powerPreference='low-power';
            if(window._trLog)window._trLog('WebGL ctx: powerPreference=low-power forzado');
          }
          // Antialiasing off en low-end lo decide _applyModelQuality via atributos,
          // pero si el contexto no admite reconfig, lo forzamos aquí también.
          try{
            if(window._v3dForceNoAA){attrs.antialias=false;}
          }catch(e){}
        }
        return _origGetCtx.call(this,type,attrs);
      };
    })();
    </script>

<div id="v3d-loading" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(20,16,8,0.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:20px 30px;border-radius:15px;border:1px solid rgba(201,169,110,0.3);box-shadow:0 8px 25px rgba(0,0,0,0.5);z-index:15;display:flex;flex-direction:column;align-items:center;gap:15px;">

<script>
window.addEventListener('error',function(e){
try{
var msg=(e&&e.message)?e.message:'unknown';
var fn=(e&&e.filename)?e.filename.split('/').pop():'';
var ln=(e&&e.lineno)?e.lineno:'?';
var line='[WINDOW ERROR] '+msg+' @ '+fn+':'+ln;
if(window._trLogBuf)window._trLogBuf.unshift('['+((Date.now()-(window._t0||Date.now()))/1000).toFixed(2)+'s] '+line);
try{localStorage.setItem(_LS_ERR_KEY,line);}catch(_){}
}catch(_){}
});
window.addEventListener('unhandledrejection',function(e){
try{
var r=e&&e.reason;
var msg=(r&&r.message)?r.message:String(r);
var line='[PROMISE REJECT] '+msg;
if(window._trLogBuf)window._trLogBuf.unshift('['+((Date.now()-(window._t0||Date.now()))/1000).toFixed(2)+'s] '+line);
try{localStorage.setItem(_LS_ERR_KEY,line);}catch(_){}
}catch(_){}
});
document.addEventListener('DOMContentLoaded', function(){
var GB='https://lightseagreen-monkey-454962.hostingersite.com/Modelos_3D/';
var MOD=["apartment_floor_plan.glb","egyptian_city_Draco.glb"];
var camO=["0.00deg 75.00deg 4.5214m","0.00deg 22.50deg 9318.1857m"];
var camT=["20.5185m 1.1631m -16.8531m","-2060.9946m 457.0706m -1700.8960m"];
var camA=["","Y"];
var _ci=-1;
var mv=document.getElementById('v3d-mv');
var ld=document.getElementById('v3d-loading');
var sel=document.getElementById('v3d-model-select');
var sCtrl=document.getElementById('v3d-style-ctrl');
var sBtn=document.getElementById('v3d-show-styles');
var hBtn=document.getElementById('v3d-hide-styles');
var sScrim=document.getElementById('v3d-style-scrim');
var ctr=document.getElementById('visor3d-ar-aydp');
if(!mv){
  try{localStorage.setItem(_LS_ERR_KEY,'mv is null - getElementById(v3d-mv) failed');}catch(_){}
  return;
}
if(!ld){
  try{localStorage.setItem(_LS_ERR_KEY,'ld is null - getElementById(v3d-loading) failed');}catch(_){}
}

function sts(m,t,d){
var ex=ctr.querySelector('.v3d-status');
if(ex)ex.remove();
var e=document.createElement('div');
e.classList.add('v3d-status');e.classList.add(t);
e.textContent=m;
ctr.appendChild(e);
setTimeout(function(){if(e.parentNode)e.remove();},d||3000);
}

var _mc={};
var _cov=null;
var _keepArr=[];
var _userO=[];
var _userT=[];
// A16c FIX: track which ci triggered the current load. Set right before
// mv.setAttribute('src',...) and checked in the load handler. If _loadCi !== _ci
// when load fires, the load corresponds to a stale model and we skip camera apply.
var _loadCi=-1;
for(var _ki=0;_ki<MOD.length;_ki++){_keepArr[_ki]=false;_userO[_ki]='';_userT[_ki]='';}
var _keepChk=document.getElementById('v3d-keep-cam');
function _covShow(){if(!_cov)_cov=document.getElementById('v3d-cam-cover');if(_cov){_cov.style.background=ctr.style.background;_cov.style.display='block';}}
function _covHide(){if(!_cov)_cov=document.getElementById('v3d-cam-cover');if(_cov){_cov.style.display='none';}}
function _saveUserCam(idx){
// A16c FIX: solo guardar si idx es el modelo ACTUAL. Si _ci cambio, idx apunta a un
// modelo viejo y estariamos pisando _userO[idx] con la camara de OTRO modelo.
// Esto evita que al cambiar rapido de modelo se crucen las camaras.
if(idx!==_ci){
  if(window._trLog)window._trLog('_saveUserCam SKIP: idx='+idx+' != _ci='+_ci+' (no pisar camara de otro modelo)');
  return;
}
try{
  var o=mv.getCameraOrbit();
  var t=mv.getCameraTarget();
  _userO[idx]=(o.theta*180/Math.PI).toFixed(2)+'deg '+(o.phi*180/Math.PI).toFixed(2)+'deg '+o.radius.toFixed(4)+'m';
  _userT[idx]=t.x.toFixed(4)+'m '+t.y.toFixed(4)+'m '+t.z.toFixed(4)+'m';
  // A16c diag: log what we saved
  if(window._trLog)window._trLog('_saveUserCam SAVED idx='+idx+' camO='+_userO[idx]+' camT='+_userT[idx]);
}catch(e){}
}
var _loadTimer=null;
function _clearLoadTimer(){if(_loadTimer){clearTimeout(_loadTimer);_loadTimer=null;}}
function _startLoadTimer(label){
_clearLoadTimer();
_loadTimer=setTimeout(function(){
  if(ld&&ld.style.display!=='none'){
    if(window._trLog)window._trLog('TIMEOUT 25s: '+label+' — load no disparó');
    sts('Timeout cargando — reintentar','v3d-error',5000);
    try{ld.style.display='none';}catch(e){}
    try{_covHide();}catch(e){}
  }
},25000);
}
function loadModel(i){
// A16c FIX: capturar ci localmente para que los callbacks del fetch usen
// el indice correcto incluso si el usuario cambio de modelo mientras tanto.
// Antes se usaba _ci en el .then(), pero _ci puede haber cambiado para entonces,
// causando que _postLoadInit aplique quality/camara del modelo equivocado.
i=parseInt(i);
if(isNaN(i)||i<0||i>=MOD.length){
  if(window._trLog)window._trLog('loadModel abort: i='+i+' invalido');
  return;
}
var ci=i;  // A16c: captura local — todos los callbacks usan ci, no _ci
if(window._trLog)window._trLog('loadModel('+ci+') — '+MOD[ci]+' (ci local fijado)');
// A16c FIX: _saveUserCam solo debe guardar si _ci sigue siendo el modelo actual.
// Si el usuario ya cambio de modelo, _ci apunta a otro lado y guardar ahi pisaria
// la camara del modelo equivocado. Verificamos con _ci===idx en _saveUserCam.
if(_ci>=0&&_ci<MOD.length){_saveUserCam(_ci);_keepArr[_ci]=_keepChk?_keepChk.checked:false;}
_ci=ci;
try{localStorage.setItem(_LS_CI_KEY,String(_ci));}catch(e){}
var f=MOD[ci];
var keep=_keepArr[ci];
if(_keepChk){_keepChk.checked=keep;}
if(!keep){_covShow();}
try{ld.style.display='flex';}catch(e){}
_startLoadTimer('loadModel '+f);
if(_mc[f]){
  if(window._trLog)window._trLog('Cache hit — setAttribute src');
  // A16c FIX: limpiar camera-orbit/camera-target ANTES de setAttribute('src').
  // Sino model-viewer lee los atributos stale del modelo anterior (eg. Egyptian)
  // y los aplica al nuevo modelo (eg. Apartment), causando que la cámara mire
  // a un punto del espacio vacío y el modelo aparezca desplazado/chico.
  try{
    var _preO=mv.getCameraOrbit();var _preT=mv.getCameraTarget();

var _isLowEndGPU=false;
var _gpuRenderer='unknown';
var _MODEL2_INDEX=1; // indice de Model2 en MOD[]

function _detectGPU(){
try{
var canvas=document.createElement('canvas');
var gl=canvas.getContext('webgl')||canvas.getContext('experimental-webgl');
if(!gl){
_isLowEndGPU=false;
_gpuRenderer='no-webgl';
_trLog('GPU detect: WebGL no disponible — asumiendo gama alta');
return;
}
var dbg=gl.getExtension('WEBGL_debug_renderer_info');
if(dbg){
_gpuRenderer=gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL)||'unknown';
}else{
_gpuRenderer=gl.getParameter(gl.RENDERER)||'unknown';
}
_trLog('GPU detect: '+_gpuRenderer);
// Patrones de GPU baja (gama entrada/media 2019-2022)
var lowEndPatterns=[/Mali-G57/i,/Mali-G52/i,/Mali-G72/i,/Mali-G76 MC1/i,/Mali-G76 MC2/i,/Adreno 5/i,/Adreno 6/i,/PowerVR GE8/i];
_isLowEndGPU=lowEndPatterns.some(function(p){return p.test(_gpuRenderer);});
_trLog('GPU detect: low-end='+_isLowEndGPU+' (renderer='+_gpuRenderer+')');
}catch(e){
_trLog('GPU detect ERROR: '+e.message+' — asumiendo gama alta');
_isLowEndGPU=false;
}
}

// ===== FPS Monitor runtime (sin AR) =====
var _fpsMonRunning=false;
var _fpsMonRAF=null;
var _fpsMonLastTs=0;
var _fpsMonFrameCount=0;
var _fpsMonSampleStartTs=0;
var _fpsMonSamples=[]; // últimos N muestras (FPS cada 500ms)
var _fpsMonMaxSamples=20; // 10s de historia
var _fpsMonAvgForModel=0; // promedio acumulado del modelo actual
var _fpsMonModelSampleCount=0;
var _fpsMonModelSampleSum=0;
var _fpsMonLastReportTs=0;
var _fpsLowBannerShown=false;
var _FPS_LOW_THRESHOLD=10; // FPS promedio para considerar "modelo pesado"
var _FPS_AR_WARN_THRESHOLD=15; // FPS para advertencia pre-AR

function _startFpsMonitor(modelName){
if(_fpsMonRunning){_stopFpsMonitor();}
_fpsMonRunning=true;
_fpsMonLastTs=performance.now();
_fpsMonFrameCount=0;
_fpsMonSampleStartTs=_fpsMonLastTs;
_fpsMonSamples=[];
_fpsMonModelSampleSum=0;
_fpsMonModelSampleCount=0;
_fpsMonAvgForModel=0;
_fpsMonLastReportTs=_fpsMonLastTs;
_fpsLowBannerShown=false;
_trLog('FPS monitor START (model='+modelName+')');
function tick(now){
if(!_fpsMonRunning)return;
_fpsMonFrameCount++;
var elapsed=now-_fpsMonSampleStartTs;
if(elapsed>=500){ // sample cada 500ms
var fps=Math.round((_fpsMonFrameCount*1000)/elapsed);
_fpsMonSamples.push(fps);
if(_fpsMonSamples.length>_fpsMonMaxSamples)_fpsMonSamples.shift();
_fpsMonModelSampleSum+=fps;
_fpsMonModelSampleCount++;
_fpsMonAvgForModel=Math.round(_fpsMonModelSampleSum/_fpsMonModelSampleCount);
// Actualizar UI
var fpsNow=document.getElementById('tr-fps-now');
if(fpsNow){fpsNow.textContent=String(fps);fpsNow.style.color=fps<_FPS_LOW_THRESHOLD?'#f4a32a':(fps<30?'#c9a96e':'#7fb069');}
var fpsAvg=document.getElementById('tr-fps-avg');
if(fpsAvg){fpsAvg.textContent=String(_fpsMonAvgForModel);fpsAvg.style.color=_fpsMonAvgForModel<_FPS_LOW_THRESHOLD?'#f4a32a':'#7fb069';}
// Log cada 5s
if(now-_fpsMonLastReportTs>=5000){
_trLog('FPS REPORT (model='+MOD[_ci]+'): now='+fps+' avg='+_fpsMonAvgForModel+' samples='+_fpsMonModelSampleCount);
// Persistir avg en localStorage para telemetría
try{
var key='visorM_5dA16c_avg_fps_'+MOD[_ci].replace(/[^a-zA-Z0-9_]/g,'_');
localStorage.setItem(key,String(_fpsMonAvgForModel));
}catch(e){}
_fpsMonLastReportTs=now;
// Banner si avg < threshold por suficientes samples
if(!_fpsLowBannerShown&&_fpsMonModelSampleCount>=6&&_fpsMonAvgForModel<_FPS_LOW_THRESHOLD){
_fpsLowBannerShown=true;
sts('⚠️ Rendimiento bajo ('+_fpsMonAvgForModel+' FPS) — modelo pesado para tu dispositivo','v3d-warning',6000);
_trLog('⚠️ BANNER LOW-FPS mostrado (avg='+_fpsMonAvgForModel+' tras '+_fpsMonModelSampleCount+' samples)');
}
}
// Reset para próximo sample
_fpsMonFrameCount=0;
_fpsMonSampleStartTs=now;
}
_fpsMonRAF=requestAnimationFrame(tick);
}
_fpsMonRAF=requestAnimationFrame(tick);
}

function _stopFpsMonitor(){
if(_fpsMonRAF){cancelAnimationFrame(_fpsMonRAF);_fpsMonRAF=null;}
if(_fpsMonRunning){
_trLog('FPS monitor STOP — avg final='+_fpsMonAvgForModel+' (model='+MOD[_ci]+', samples='+_fpsMonModelSampleCount+')');
}
_fpsMonRunning=false;
}

function setupZoom(){
var c=document.getElementById('visor3d-ar-aydp');
c.addEventListener('wheel',function(e){
e.preventDefault();e.stopImmediatePropagation();
var rect=mv.getBoundingClientRect();
var x=e.clientX-rect.left;var y=e.clientY-rect.top;
try{
mv.jumpCameraToGoal();
var orbit=mv.getCameraOrbit();var target=mv.getCameraTarget();
var delta=Math.sign(e.deltaY);
var zf=delta<0?(1/1.12):1.12;
var newRadius=Math.max(0.001,orbit.radius*zf);
var sp=Math.sin(orbit.phi),cp=Math.cos(orbit.phi);
var st=Math.sin(orbit.theta),ct=Math.cos(orbit.theta);
var camX=target.x+orbit.radius*sp*st;
var camY=target.y+orbit.radius*cp;
var camZ=target.z+orbit.radius*sp*ct;
var vdX=target.x-camX,vdY=target.y-camY,vdZ=target.z-camZ;
var vdLen=Math.sqrt(vdX*vdX+vdY*vdY+vdZ*vdZ);
if(vdLen>0.001){vdX/=vdLen;vdY/=vdLen;vdZ/=vdLen;}
var crX=ct,crY=0,crZ=-st;
var cuX=-st*cp,cuY=sp,cuZ=-ct*cp;
var fovY=45;
try{if(typeof mv.fieldOfView==='number'&&mv.fieldOfView>1&&mv.fieldOfView<179)fovY=mv.fieldOfView;}catch(ex){}
var aspect=rect.width/rect.height;
var thfy=Math.tan(fovY*Math.PI/360);
var thfx=thfy*aspect;
var ndcX=(2*x/rect.width)-1;
var ndcY=1-(2*y/rect.height);
var rX=vdX+ndcX*thfx*crX+ndcY*thfy*cuX;
var rY=vdY+ndcX*thfx*crY+ndcY*thfy*cuY;
var rZ=vdZ+ndcX*thfx*crZ+ndcY*thfy*cuZ;
var rLen=Math.sqrt(rX*rX+rY*rY+rZ*rZ);
rX/=rLen;rY/=rLen;rZ/=rLen;
var denom=rX*vdX+rY*vdY+rZ*vdZ;
if(Math.abs(denom)>0.001&&zf<1){
var t=((target.x-camX)*vdX+(target.y-camY)*vdY+(target.z-camZ)*vdZ)/denom;
var planeX=camX+t*rX;var planeY=camY+t*rY;var planeZ=camZ+t*rZ;
var ntx=planeX+(target.x-planeX)*zf;
var nty=planeY+(target.y-planeY)*zf;
var ntz=planeZ+(target.z-planeZ)*zf;
mv.setAttribute('camera-target',ntx.toFixed(4)+'m '+nty.toFixed(4)+'m '+ntz.toFixed(4)+'m');
}
mv.setAttribute('camera-orbit',(orbit.theta*180/Math.PI).toFixed(2)+'deg '+(orbit.phi*180/Math.PI).toFixed(2)+'deg '+newRadius.toFixed(4)+'m');
mv.jumpCameraToGoal();
}catch(ex){}
},{passive:false,capture:true});
}

// ===== AR orientation transfer desde theta 3D =====
// Cuaternión pendiente de aplicar al entrar a AR (formato: '0 qy 0 qw')
var _arOrientPending=null; // string lista para setAttribute('orientation', ...)
var _LS_AR_ORIENT_KEY='visorM_5dA16c_ar_orient_quaternion';
var _arOrientAppliedCount=0;
var _arOrientLastTheta=null;

function _computeAROrientation(){
// Lee el camera-orbit actual del model-viewer y calcula un cuaternión
// que rote el modelo en Y para preservar el ángulo horizontal en AR.
// camera-orbit = 'theta phi radius' (theta=azimuth, en degrees)
try{
  var o=mv.getCameraOrbit();
  if(!o)return null;
  var thetaRad=o.theta; // radianes
  var thetaDeg=thetaRad*180/Math.PI;
  _arOrientLastTheta=thetaDeg;
  // ARCore usa modelo estándar: rotación Y por -theta (inversa)
  // Cuaternión (0, sin(-theta/2), 0, cos(-theta/2)) = (0, -sin(theta/2), 0, cos(theta/2))
  var halfTheta=-thetaRad/2;
  var qy=Math.sin(halfTheta);
  var qw=Math.cos(halfTheta);
  var qStr='0 '+qy.toFixed(6)+' 0 '+qw.toFixed(6);
  _trLog('AR ORIENT computed: theta='+thetaDeg.toFixed(2)+'° → q=('+qStr+')');
  return qStr;
}catch(e){
  _trLog('AR ORIENT compute ERROR: '+e.message);
  return null;
}
}

function _applyArOrientation(target){
// Aplica la orientación pendiente al model-viewer antes de AR
try{
  var q=_arOrientPending;
  if(!q){
    _trLog('AR ORIENT skip: sin cuaternión pendiente');
    return;
  }
  target.setAttribute('orientation',q);
  _trLog('AR ORIENT applied: orientation='+q);
  _arOrientAppliedCount++;
  // Telemetría
  try{
    localStorage.setItem('visorM_5dA16c_ar_orient_applied',String(_arOrientAppliedCount));
    if(_arOrientLastTheta!==null){
      localStorage.setItem('visorM_5dA16c_ar_orient_theta',String(_arOrientLastTheta.toFixed(2)));
    }
  }catch(e){}
  var ao=document.getElementById('tr-ar-orient');
  if(ao){ao.textContent=(_arOrientLastTheta!==null?_arOrientLastTheta.toFixed(0)+'°':'?');ao.style.color='#7fb069';}
}catch(e){_trLog('AR ORIENT apply ERROR: '+e.message);}
}

function _resetArOrientation(target){
// Restablece orientación a identidad al salir de AR
try{
  target.setAttribute('orientation','0 0 0 1');
  _trLog('AR ORIENT reset a identidad (post-AR)');
  var ao=document.getElementById('tr-ar-orient');
  if(ao){ao.textContent='-';ao.style.color='#8a7040';}
}catch(e){_trLog('AR ORIENT reset ERROR: '+e.message);}
}

function _persistArOrientForReload(qStr){
// Persistir cuaternión en localStorage para sobrevivir reload de cleanup
try{
  if(qStr){
    localStorage.setItem(_LS_AR_ORIENT_KEY,qStr);

  }else{

txt+='Generado: '+new Date().toLocaleString('es-AR')+'\n';
txt+='=== SESION ACTUAL ===\n';
txt+='AR exitosas: '+_arCount+' | AR intentos: '+_arAttempts+'/'+_RELOAD_LIMIT+' (reload proactivo a '+_RELOAD_LIMIT+') | Replaces: '+_repCount+'\n';
txt+='=== TOTAL ACUMULATIVO (no se resetea) ===\n';
txt+='Cubo AR taps: '+_arTotalCubePresses+' | AR entradas: '+_arTotalEntries+' | X-closes (manuales): '+_arTotalXCloses+' | Auto-exits: '+_arTotalAutoExits+' | Reloads: '+_arReloads+'\n';
txt+='DIAGNOSTICO: Cubo - X = '+(_arTotalCubePresses-_arTotalXCloses)+' (si >0, hubo sesiones que no se cerraron con X)\n';
txt+='Modelos: '+MOD.join(', ')+'\n';
txt+='UserAgent: '+navigator.userAgent+'\n';
txt+='URL: '+location.href+'\n';
txt+='================================================\n\n';
txt+=lines.join('\n');
return txt;
}

function _downloadLogDirect(txt){
try{
var blob=new Blob([txt],{type:'text/plain;charset=utf-8'});
var url=URL.createObjectURL(blob);
var a=document.createElement('a');
a.href=url;
a.download='visorM_5dA16c_log_'+Date.now()+'.txt';
a.style.display='none';
document.body.appendChild(a);
a.click();
setTimeout(function(){
try{document.body.removeChild(a);}catch(e){}
try{URL.revokeObjectURL(url);}catch(e){}
},2000);
_trLog('Log descargado OK via Blob ('+txt.length+' chars)');
sts('Log descargado','v3d-info',3000);
return true;
}catch(e){
_trLog('Blob download fallo: '+e.message);
return false;
}
}

function _showLogModal(txt){
var existing=document.getElementById('tr-log-modal');
if(existing)existing.remove();
var modal=document.createElement('div');
modal.id='tr-log-modal';
var ta=document.createElement('textarea');
ta.readOnly=true;
ta.value=txt;
ta.spellcheck=false;
var btns=document.createElement('div');
btns.className='modal-btns';
var dlBtn=document.createElement('button');
dlBtn.textContent='Descargar .txt';
dlBtn.onclick=function(){
var ok=_downloadLogDirect(txt);
if(ok){modal.remove();}
};
var copyBtn=document.createElement('button');
copyBtn.textContent='Copiar al portapapeles';
copyBtn.onclick=function(){
_tryCopyToClipboard(txt,function(ok,msg){
if(ok){
sts('Log copiado','v3d-info',3000);
modal.remove();
}else{
sts('No se pudo copiar: '+msg,'v3d-error',4000);
}
});
};
var closeBtn=document.createElement('button');
closeBtn.textContent='Cerrar';
closeBtn.className='close';
closeBtn.onclick=function(){modal.remove();};
btns.appendChild(dlBtn);
btns.appendChild(copyBtn);
btns.appendChild(closeBtn);
modal.appendChild(ta);
modal.appendChild(btns);
document.body.appendChild(modal);
setTimeout(function(){ta.focus();ta.select();},50);
_trLog('Modal de log mostrado (fallback)');
}

function _tryCopyToClipboard(txt,cb){
try{
if(navigator.clipboard&&navigator.clipboard.writeText){
navigator.clipboard.writeText(txt).then(function(){
cb(true,'OK');
}).catch(function(err){
var ok=_copyViaExecCommand(txt);
cb(ok,ok?'OK':(err&&err.message?err.message:'unknown'));
});
}else{
var ok=_copyViaExecCommand(txt);
cb(ok,ok?'OK':'clipboard API no disponible');
}
}catch(e){
var ok=_copyViaExecCommand(txt);
cb(ok,ok?'OK':(e&&e.message?e.message:'unknown'));
}
}

function _copyViaExecCommand(txt){
try{
var ta=document.createElement('textarea');
ta.value=txt;
ta.style.position='fixed';
ta.style.top='0';
ta.style.left='0';
ta.style.width='100%';
ta.style.height='200px';
ta.style.opacity='0.01';
document.body.appendChild(ta);
ta.focus();
ta.select();
ta.setSelectionRange(0,txt.length);
var ok=false;
try{ok=document.execCommand('copy');}catch(e){ok=false;}
setTimeout(function(){try{document.body.removeChild(ta);}catch(e){}},500);
return ok;
}catch(e){return false;}
}

function _downloadLog(){
_trLog('Download log solicitado');
var txt=_buildLogText();
var ok=_downloadLogDirect(txt);
if(ok)return;
_trLog('Fallback a modal de textarea');
_showLogModal(txt);
}

function _copyLog(){
_trLog('Copy log solicitado');
var txt=_buildLogText();
_tryCopyToClipboard(txt,function(ok,msg){
if(ok){
sts('Log copiado al portapapeles','v3d-info',3000);
_trLog('Log copiado OK');
}else{
_trLog('Copy fallo: '+msg+' — mostrando modal');
_showLogModal(txt);
}
});
}

var trDlBtn=document.getElementById('tr-dl-btn');
if(trDlBtn){trDlBtn.addEventListener('click',_downloadLog);}

var trMarkXBtn=document.getElementById('tr-markx-btn');
if(trMarkXBtn){trMarkXBtn.addEventListener('click',function(){
_arTotalXCloses++;
_trUpdate();
_trLog('X-CLOSE MANUAL #'+_arTotalXCloses+' — usuario confirmo haber cerrado AR con X');
_trPersistStats();
_trPersist();
var diff=_arTotalEntries-_arTotalXCloses;
sts('Marcado X-close #'+_arTotalXCloses+' (diferencia Cubo-X='+diff+')','v3d-info',3000);
});}

var trClrBtn=document.getElementById('tr-clr-btn');
if(trClrBtn){trClrBtn.addEventListener('click',function(){
if(!confirm('Limpiar TODO? Se borrarán:\n- Log de sesion\n- Contadores de sesion (AR, Att, Rep)\n- Contadores TOTAL (Cubo, Ent, X, Auto, Rld)\n\nEsto no se puede deshacer.'))return;
_trLogBuf=[];
_arCount=0;
_arAttempts=0;
_repCount=0;
_AR_BLOCKED=false;
_arTotalEntries=0;
_arTotalXCloses=0;
_arTotalAutoExits=0;
_arTotalCubePresses=0;
_arReloads=0;
_t0=Date.now();
_trPersist();
try{localStorage.removeItem(_LS_ATT_KEY);}catch(e){}
try{localStorage.removeItem(_LS_STATS_KEY);}catch(e){}
var el=document.getElementById('tr-log');
if(el)el.innerHTML='';
_trUpdate();
_trLog('TODO limpiado — contadores de sesion y TOTAL reseteados a 0');
sts('Log y contadores limpiados','v3d-info',1500);
});}
_detectGPU(); // M11: detección GPU al inicio para que _applyModelQuality use _isLowEndGPU correcto
_trRestoreStats();
if(_trRestore()){
_trReady=true;
_trLog('Sesion restaurada 5d-A16c desde localStorage');
}else{
_trReady=true;
_trLog('Init 5d-A16c OK (nueva sesion) — stats acumulativos: Cubo='+_arTotalCubePresses+' Ent='+_arTotalEntries+' X='+_arTotalXCloses+' Auto='+_arTotalAutoExits+' Rld='+_arReloads);
}
_trMem('init');
// Persistir telemetría extendida
try{localStorage.setItem('visorM_5dA16c_dpr',String(window.devicePixelRatio||'unknown'));}catch(e){}
try{localStorage.setItem('visorM_5dA16c_renderer',String(_gpuRenderer).substring(0,60));}catch(e){}
try{localStorage.setItem('visorM_5dA16c_lowpower',window._v3dCtxPatched?'1':'0');}catch(e){}
_trLog('A12 telemetry: dpr='+(window.devicePixelRatio||'?')+', renderer='+_gpuRenderer+', low-power-patched='+window._v3dCtxPatched);
var _gpuStatus=document.getElementById('tr-gpu-status');
if(_gpuStatus){
_gpuStatus.textContent=_gpuRenderer.substring(0,30)+( _isLowEndGPU?' (LOW-END)':' (FULL)');
_gpuStatus.style.color=_isLowEndGPU?'#f4a32a':'#7fb069';
}
_trUpdate();
try{
var _wasReload=localStorage.getItem(_LS_RELOAD_KEY);
if(_wasReload==='1'){
// M12 fix: _arReloads ya fue restaurado por _trRestoreStats() incluyendo el reload que disparó este init.
// Antes se duplicaba. Ahora no se incrementa acá.
_arCount=0;
_arAttempts=0;
_AR_BLOCKED=false;
_trUpdate();
var _reloadReason='unknown';
try{var _rr=localStorage.getItem(_LS_RELOAD_REASON_KEY);if(_rr)_reloadReason=_rr;}catch(e){}
_trLog('AUTO-RELOAD detectado (motivo: '+_reloadReason+') — contadores de sesion reseteados a 0 (AR='+_arCount+', attempts='+_arAttempts+') — TOTAL preservado: Cubo='+_arTotalCubePresses+' Ent='+_arTotalEntries+' X='+_arTotalXCloses+' Auto='+_arTotalAutoExits+' Rld='+_arReloads);
localStorage.removeItem(_LS_RELOAD_KEY);
try{localStorage.removeItem(_LS_RELOAD_REASON_KEY);}catch(e){}
try{localStorage.removeItem(_LS_ATT_KEY);}catch(e){}
_trPersistStats();
_trPersist();
}
}catch(e){}
try{
var _errLog=localStorage.getItem(_LS_ERR_KEY);
if(_errLog){
_trLog('ERR previa: '+_errLog);
localStorage.removeItem(_LS_ERR_KEY);
}
}catch(e){}
try{
if(window.customElements&&customElements.get&&customElements.get('model-viewer')){
_trLog('model-viewer definido OK');
}else{
_trLog('WARN: model-viewer NO definido aún — puede haber delay');
}
}catch(e){}
var _restoredCi=-1;
try{var c=localStorage.getItem(_LS_CI_KEY);if(c!==null){_restoredCi=parseInt(c);localStorage.removeItem(_LS_CI_KEY);}}catch(e){}
// Restaurar orientation pendiente si existe (tras cleanup reload)
_restoreArOrientIfPending();
// Log telemetría cleanup contador
try{
  var _cleanupCnt=localStorage.getItem('visorM_5dA16c_cubotap_with_cleanup');
  if(_cleanupCnt){_trLog('A13 telemetry: cleanups previos acumulados='+_cleanupCnt);}
}catch(e){}
if(_restoredCi>=0&&_restoredCi<MOD.length){
sel.value=String(_restoredCi);
_trLog('Modelo restaurado: '+MOD[_restoredCi]+' (ci='+_restoredCi+')');
loadModel(_restoredCi);
}else{
loadModel(sel.value);
}
chkAR();
});
</script>
